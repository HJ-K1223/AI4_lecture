<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/products" aria-label="{{ app_name }} 상품 목록">
                <span class="brand-mark" aria-hidden="true">소</span>
                <span>{{ app_name }}</span>
            </a>
            <nav class="main-nav" aria-label="주 메뉴">
                <a href="/products" {% if active_page == 'products' %}aria-current="page"{% endif %}>상품</a>
                <a href="/cart" {% if active_page == 'cart' %}aria-current="page"{% endif %}>장바구니</a>
                <span class="nav-disabled" aria-disabled="true" title="준비 중">회원정보<span class="sr-only"> (준비 중)</span></span>
                {% if member %}
                <form action="/logout" method="post" class="nav-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit" class="nav-button">로그아웃</button>
                </form>
                {% else %}
                <a href="{% if next_path is defined %}/login?next={{ next_path | urlencode }}{% else %}{{ login_href }}{% endif %}" {% if request.url.path == '/login' %}aria-current="page"{% endif %}>로그인</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main id="main-content" class="container main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container footer-inner">
            <span class="footer-brand">{{ app_name }}</span>
            <p>일상에 필요한 물건을 담는 곳.</p>
        </div>
    </footer>
    <script src="{{ url_for('static', path='/js/common.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
